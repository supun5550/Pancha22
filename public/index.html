<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>22 Agroz</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- Main site -->
<div id="site">
  <header class="relative px-5 pb-[70px] pt-[60px] text-center">
    <div id="adminBar" hidden class="absolute right-4 top-[calc(14px+env(safe-area-inset-top,0px))] flex items-center gap-2.5 text-sm text-mut"><span>👤 Admin</span><button id="out" class="chip">Sign out</button></div>
    <h1 class="mb-2.5 bg-gradient-to-r from-white via-violet-200 to-cyan-300 bg-clip-text text-5xl font-extrabold tracking-tight text-transparent md:text-6xl">22 Agroz</h1>
    <p class="mx-auto max-w-[520px] text-mut">Lecture notes and Kuppi videos for the Faculty of Agriculture, University of Peradeniya.</p>
    <div id="stats" class="mt-5 flex flex-wrap justify-center gap-2.5"></div>
  </header>

  <main class="mx-auto -mt-9 max-w-[1060px] px-4 pb-24">
    <div class="rounded-[20px] border border-white/10 bg-[#141434]/70 p-3.5 shadow-2xl backdrop-blur-xl">
      <input id="q" type="search" class="field" placeholder="Search notes and videos…" aria-label="Search">
      <div id="subs" class="mt-3 flex flex-wrap gap-2"></div>
      <div id="tabs" class="mt-3 flex flex-wrap gap-2 border-t border-white/10 pt-3"></div>
    </div>
    <div id="app" class="mt-6 grid gap-[18px] [grid-template-columns:repeat(auto-fill,minmax(285px,1fr))]"></div>
  </main>

  <footer class="px-4 pb-10 text-center text-[13px] text-mut">Made for students, by a student. Happy studying! <button id="alink" class="ml-2 text-white/30 hover:text-white/70">Admin</button></footer>
  <button id="fab" hidden class="fixed bottom-[calc(18px+env(safe-area-inset-bottom,0px))] right-[18px] rounded-full bg-gradient-to-br from-agro-pink to-agro-violet px-6 py-3.5 text-base font-bold shadow-xl shadow-violet-600/50">＋ Add material</button>
</div>

<!-- Add / edit material -->
<dialog id="add">
  <h2 id="dh" class="mb-3 text-xl font-bold">Add material</h2>
  <label class="lbl">Title</label><input id="f-title" class="field">
  <label class="lbl">Subject</label><input id="f-sub" class="field" list="sl" placeholder="Type a subject name, e.g. Soil Science" autocomplete="off"><datalist id="sl"></datalist>
  <label class="lbl">Type</label>
  <select id="f-kind" class="field"><option value="note">Lecture note</option><option value="kuppi">Kuppi video</option></select>
  <label class="lbl">Short description (optional)</label><textarea id="f-desc" rows="2" class="field"></textarea>
  <label id="fl" class="lbl">Upload a file (PDF, slides or video, up to 15 MB)</label><input id="f-file" type="file" class="field">
  <label class="lbl">…or paste a link (YouTube, Google Drive, etc.)</label><input id="f-link" type="url" class="field" placeholder="https://">
  <div id="msg" class="mt-2 min-h-[18px] text-[13px] text-pink-300"></div>
  <div class="mt-4 flex justify-end gap-2"><button class="btn btn-ghost" id="f-cancel">Cancel</button><button class="btn" id="f-save">Save</button></div>
</dialog>

<!-- Admin sign in (owner only) -->
<dialog id="adm">
  <h2 class="mb-1 text-xl font-bold">Admin sign in</h2>
  <p class="mb-2 text-sm text-mut">Only the site owner needs this, to add, edit or delete materials.</p>
  <input id="apw" type="password" class="field" placeholder="Admin password" autocomplete="current-password">
  <div id="aerr" class="mt-2 min-h-[18px] text-[13px] text-pink-300"></div>
  <div class="mt-3 flex justify-end gap-2"><button class="btn btn-ghost" id="a-cancel">Cancel</button><button class="btn" id="a-go">Sign in</button></div>
</dialog>

<!-- Video player -->
<dialog id="vid"><div id="vbox"></div><div class="mt-4 flex justify-end"><button class="btn btn-ghost" id="v-close">Close</button></div></dialog>

<script src="/app.js"></script>
</body>
</html>
